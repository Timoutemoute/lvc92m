<!DOCTYPE html>
<html lang="fr">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire Harcèlement</title>
    <style>
        /* Style global du formulaire - RECTIFIÉ EN CLAIR */
        .quiz-container {
            background-color: #ffffff; /* Fond blanc comme sur ta photo */
            color: #1a1a1a;            /* Texte sombre */
            padding: 30px;
            border-radius: 12px;
            max-width: 650px;
            margin: 20px auto;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05); /* Ombre plus douce */
            border: 1px solid #e0e0e0; /* Bordure grise claire comme ton site */
        }

        .quiz-container h2 {
            color: #000000; /* Titre noir */
            margin-bottom: 10px;
            font-size: 24px;
        }

        .quiz-container .subtitle {
            color: #626262; /* Sous-titre gris */
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* Style des lignes de questions */
        .quiz-option {
            display: flex;
            align-items: flex-start;
            background-color: #f7f7f9; /* Fond des cases légèrement grisé */
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
            border: 1px solid transparent;
        }

        .quiz-option:hover {
            background-color: #eeeeee;
            border-color: #4a90e2;
        }

        .quiz-option input[type="checkbox"] {
            margin-top: 4px;
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
            accent-color: #4a90e2;
        }

        .quiz-option label {
            cursor: pointer;
            font-size: 15px;
            line-height: 1.4;
            flex: 1;
            color: #1a1a1a;
        }

        /* Bouton de validation */
        .quiz-btn {
            background-color: #4a90e2; /* Bleu clair assorti */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s ease;
        }

        .quiz-btn:hover {
            background-color: #357abd;
        }

        /* Boîte de résultat */
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .result-attention {
            background-color: #fde8e8; /* Alerte rouge claire */
            color: #9b1c1c;
            border: 1px solid #f8b4b4;
        }

        .result-ras {
            background-color: #def7ec; /* Alerte verte claire */
            color: #03543f;
            border: 1px solid #bcf0da;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>Te sens-tu bien au collège / lycée ?</h2>
    <p class="subtitle">Coche les cases si tu as déjà vécu ou si tu vis ces situations régulièrement.</p>
    
    <form id="quizForm">
        <div class="quiz-option">
            <input type="checkbox" id="q1" name="harcelement">
            <label for="q1">On se moque de moi, on m'insulte ou on me donne des surnoms méchants régulièrement.</label>
        </div>
        
        <div class="quiz-option">
            <input type="checkbox" id="q2" name="harcelement">
            <label for="q2">J'ai l'impression qu'on me met exprès à l'écart pendant la récréation ou sur les réseaux.</label>
        </div>
        
        <div class="quiz-option">
            <input type="checkbox" id="q3" name="harcelement">
            <label for="q3">On m'a déjà bousculé, frappé, ou on a fait exprès d'abîmer ou de voler mes affaires.</label>
        </div>
        
        <div class="quiz-option">
            <input type="checkbox" id="q4" name="harcelement">
            <label for="q4">Je reçois des messages méchants ou je vois des rumeurs sur moi sur internet ou par téléphone.</label>
        </div>
        
        <div class="quiz-option">
            <input type="checkbox" id="q5" name="harcelement">
            <label for="q5">On m'oblige parfois à faire des choses que je n'ai pas du tout envie de faire.</label>
        </div>
        
        <div class="quiz-option">
            <input type="checkbox" id="q6" name="harcelement">
            <label for="q6">J'ai souvent la boule au ventre, envie de pleurer ou du mal à dormir avant d'aller en cours.</label>
        </div>
        
        <button type="button" class="quiz-btn" onclick="verifierQuiz()">Voir le résultat</button>
    </form>

    <div id="resultBox" class="result-box">
        <h3 id="resultTitle"></h3>
        <p id="resultText"></p>
    </div>
</div>

<script>
function verifierQuiz() {
    const checkboxes = document.querySelectorAll('input[name="harcelement"]:checked');
    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const resultText = document.getElementById('resultText');
    
    resultBox.style.display = "block";
    
    if (checkboxes.length > 0) {
        resultBox.className = "result-box result-attention";
        resultTitle.innerText = "Prends ça au sérieux";
        resultText.innerHTML = "Tu as coché au moins une situation répétée. Ce n'est pas une simple blague et <strong>ce n'est pas de ta faute</strong>. Ne reste pas seul avec ça. Parles-en à tes parents, à l'infirmerie de ton établissement ou contacte directement <strong>Les Voix Claires 92</strong>. On est là pour t'aider !";
    } else {
        resultBox.className = "result-box result-ras";
        resultTitle.innerText = "Tout semble aller pour le mieux";
        resultText.innerText = "Tu n'as coché aucune case. Si jamais la situation change ou si tu t'inquiètes pour un ami, n'hésite pas à revenir vers nous ou à en parler autour de toi !";
    }
}
</script>

</body>
</html>
