<!DOCTYPE html> 
<html lang="fr"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCHAT et Assistance - Les Voix Claires 92</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="Logo.png">
    <style>
        .chat-section {
            max-width: 650px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .status-badge.open {
            background-color: rgba(40, 167, 69, 0.1);
            color: #28a745;
        }

        .status-badge.closed {
            background-color: rgba(217, 83, 79, 0.1);
            color: #d9534f;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-badge.open .status-dot { background-color: #28a745; }
        .status-badge.closed .status-dot { background-color: #d9534f; }

        .clean-card {
            background-color: var(--card-bg, #ffffff);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.05);
            text-align: center;
        }

        .emergency-list-simple {
            list-style: none;
            padding: 0;
            margin: 1.5rem 0 0 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .emergency-item {
            background-color: var(--bg-color, #f8f9fa);
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Case à cocher élégante et sobre */
        .cgu-consent-container {
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #555;
        }

        .cgu-consent-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color, #0056b3);
        }

        .cgu-consent-container label {
            cursor: pointer;
            user-select: none;
        }

        .cgu-consent-container a {
            color: var(--primary-color, #0056b3);
            text-decoration: underline;
        }

        .chat-instruction {
            font-weight: 600;
            margin-top: 1.2rem;
            color: var(--primary-color, #0056b3);
            transition: opacity 0.3s;
        }

        /* Mode sombre */
        body:not(.light) .clean-card {
            background-color: #1a1a1a;
            border-color: rgba(255,255,255,0.05);
        }
        body:not(.light) .emergency-item {
            background-color: #252525;
        }
        body:not(.light) .cgu-consent-container {
            border-top-color: rgba(255, 255, 255, 0.1);
            color: #ccc;
        }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
        }
    </script>

    <nav> 
        <img src="Logo.png" alt="Les Voix Claires">
        <button class="menu-toggle" aria-label="Menu">
            <span class="hamburger"></span>
        </button>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="urgence.html">Urgences</a>
            <a href="equipe.html">Notre équipe</a>
            <a href="recrutement.html">Recrutement</a>
            <a href="temoignages.html">Témoignages</a>
            <a href="questionnaire.html">QCM Harcèlement</a>
            <a href="tchat.html" class="active">TCHAT</a>
            <a href="partenaires.html">Nos Partenaires</a>
            <div class="theme-switch" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span>
            </div>
        </div>
    </nav>

    <div class="menu-overlay"></div>

    <section class="page-content" style="padding-top: 120px;">
        <div class="chat-section">
            <h1 style="text-align: center;">TCHAT et Assistance</h1>
            <p class="intro-text" style="text-align: center; margin-bottom: 2rem;">Une oreille attentive pour briser le silence.</p>

            <div id="dynamic-chat-container"></div>
        </div>
    </section>

    <footer>
        <div class="footer-links">
            <a href="mentions-legales.html">Mentions légales</a>
            <a href="confidentialite.html">Politique de confidentialité</a>
            <a href="cgu.html">CGU</a>
        </div>
        <p>© 2026 Les Voix Claires 92 – Association contre le harcèlement scolaire</p>
    </footer>

    <script>
        // Fonction pour activer le module de tchat quand la case est cochée
        function handleCguConsent(checkbox) {
            const instruction = document.getElementById('chatInstruction');
            
            if (checkbox.checked) {
                if (instruction) {
                    instruction.innerHTML = "La bulle de tchat est activée en bas à droite.";
                    instruction.style.color = "#28a745";
                }
                
                // Injecte le script 3CX uniquement après acceptation
                if (!document.getElementById('tcx-callus-js')) {
                    const tcxScript = document.createElement('script');
                    tcxScript.defer = true;
                    tcxScript.src = "https://downloads-global.3cx.com/downloads/livechatandtalk/v1/callus.js";
                    tcxScript.id = "tcx-callus-js";
                    document.body.appendChild(tcxScript);

                    const tcxSelector = document.createElement('call-us-selector');
                    tcxSelector.setAttribute('phonesystem-url', 'https://1761.3cx.cloud');
                    tcxSelector.setAttribute('party', 'LiveChat459960');
                    document.body.appendChild(tcxSelector);
                }
            } else {
                if (instruction) {
                    instruction.innerHTML = "Veuillez accepter les conditions ci-dessus pour ouvrir le tchat.";
                    instruction.style.color = "var(--primary-color, #0056b3)";
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('dynamic-chat-container');
            const currentHour = new Date().getHours();
            
            // Horaires : Fermé de 21h à 7h
            const isNight = currentHour >= 21 || currentHour < 7;

            if (isNight) {
                container.innerHTML = `
                    <div class="clean-card">
                        <div class="status-badge closed">
                            <span class="status-dot"></span> Tchat actuellement fermé
                        </div>
                        <p style="margin-bottom: 0.5rem;">Nos bénévoles sont indisponibles pour le moment.</p>
                        <p style="font-size: 0.9rem; color: #777;">Horaires d'écoute : <strong>7h00 – 21h00</strong></p>

                        <ul class="emergency-list-simple">
                            <li class="emergency-item">3114 — Prévention du suicide (Gratuit 24h/24)</li>
                            <li class="emergency-item">112, 15 ou 17 — Urgences vitales</li>
                        </ul>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="clean-card">
                        <div class="status-badge open">
                            <span class="status-dot"></span> Écoute ouverte (7h – 21h)
                        </div>
                        <p>Discutez en direct et de manière confidentielle avec l'un de nos bénévoles.</p>

                        <div class="cgu-consent-container">
                            <input type="checkbox" id="cguConsent" onchange="handleCguConsent(this)">
                            <label for="cguConsent">J'accepte les <a href="cgu.html" target="_blank">conditions générales d'utilisation</a></label>
                        </div>

                        <p id="chatInstruction" class="chat-instruction">
                            Veuillez accepter les conditions ci-dessus pour ouvrir le tchat.
                        </p>
                    </div>
                `;
            }
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
