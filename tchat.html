<!DOCTYPE html> 
<html lang="fr"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCHAT et Assistance – Les Voix Claires 92</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="Logo.png">
    <style>
        /* Ajustements spécifiques TCHAT - Sobres & Professionnels */
        .chat-wrapper {
            max-width: 520px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .chat-card {
            background-color: var(--card-bg, #ffffff);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        /* Badge de statut moderne */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .status-badge.open {
            background-color: #E6F4EA;
            color: #137333;
        }

        .status-badge.closed {
            background-color: #FCE8E6;
            color: #C5221F;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-badge.open .status-dot { background-color: #137333; }
        .status-badge.closed .status-dot { background-color: #C5221F; }

        .chat-card h2 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-color, #222);
            margin-bottom: 8px;
        }

        .chat-card p.description {
            font-size: 0.92rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Bloc CGU parfaitement aligné sur mobile */
        .cgu-box {
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding-top: 20px;
            display: flex;
            align-items: flex-start; /* Alignement propre en haut */
            gap: 12px;
            text-align: left;
            max-width: 400px;
            margin: 0 auto;
        }

        .cgu-box input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: #0056b3;
        }

        .cgu-box label {
            font-size: 0.88rem;
            line-height: 1.45;
            color: #444;
            cursor: pointer;
        }

        .cgu-box a {
            color: #0056b3;
            text-decoration: underline;
            font-weight: 500;
        }

        /* Message ou bouton d'activation */
        .chat-status-msg {
            margin-top: 20px;
            font-size: 0.88rem;
            font-weight: 500;
            color: #777;
            transition: all 0.3s ease;
        }

        .chat-status-msg.active {
            color: #137333;
            font-weight: 600;
        }

        .emergency-list {
            list-style: none;
            padding: 0;
            margin: 20px 0 0 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .emergency-item {
            background-color: rgba(0, 0, 0, 0.03);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Compatibilité Mode Sombre */
        body:not(.light) .chat-card {
            background-color: #1e1e1e;
            border-color: rgba(255, 255, 255, 0.08);
        }

        body:not(.light) .chat-card h2 {
            color: #fff;
        }

        body:not(.light) .chat-card p.description,
        body:not(.light) .cgu-box label {
            color: #bbb;
        }

        body:not(.light) .cgu-box {
            border-top-color: rgba(255, 255, 255, 0.1);
        }

        body:not(.light) .emergency-item {
            background-color: rgba(255, 255, 255, 0.05);
            color: #eee;
        }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
        }
    </script>

    <nav> 
        <img src="Logo.png" alt="Les Voix Claires">
        <button class="menu-toggle" aria-label="Menu">
            <span class="hamburger"></span>
        </button>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="urgence.html">Urgences</a>
            <a href="equipe.html">Notre équipe</a>
            <a href="recrutement.html">Recrutement</a>
            <a href="temoignages.html">Témoignages</a>
            <a href="questionnaire.html">QCM Harcèlement</a>
            <a href="tchat.html" class="active">TCHAT</a>
            <a href="partenaires.html">Nos Partenaires</a>
            <div class="theme-switch" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span>
            </div>
        </div>
    </nav>

    <div class="menu-overlay"></div>

    <section class="page-content" style="padding-top: 110px; padding-bottom: 60px;">
        <div class="chat-wrapper">
            <h1 style="text-align: center; font-size: 1.8rem; margin-bottom: 6px;">TCHAT et Assistance</h1>
            <p style="text-align: center; color: #777; margin-bottom: 28px; font-size: 0.95rem;">Une oreille attentive pour briser le silence.</p>

            <div id="dynamic-chat-container"></div>
        </div>
    </section>

    <footer>
        <div class="footer-links">
            <a href="mentions-legales.html">Mentions légales</a>
            <a href="confidentialite.html">Politique de confidentialité</a>
            <a href="cgu.html">CGU</a>
        </div>
        <p>© 2026 Les Voix Claires 92 – Association contre le harcèlement scolaire</p>
    </footer>

    <script>
        function handleCguConsent(checkbox) {
            const statusMsg = document.getElementById('chatStatusMsg');
            
            if (checkbox.checked) {
                if (statusMsg) {
                    statusMsg.innerHTML = "✓ Tchat disponible via le bouton en bas à droite";
                    statusMsg.className = "chat-status-msg active";
                }
                
                // Injection du script 3CX
                if (!document.getElementById('tcx-callus-js')) {
                    const tcxScript = document.createElement('script');
                    tcxScript.defer = true;
                    tcxScript.src = "https://downloads-global.3cx.com/downloads/livechatandtalk/v1/callus.js";
                    tcxScript.id = "tcx-callus-js";
                    document.body.appendChild(tcxScript);

                    const tcxSelector = document.createElement('call-us-selector');
                    tcxSelector.setAttribute('phonesystem-url', 'https://1761.3cx.cloud');
                    tcxSelector.setAttribute('party', 'LiveChat459960');
                    document.body.appendChild(tcxSelector);
                }
            } else {
                if (statusMsg) {
                    statusMsg.innerHTML = "Cochez la case ci-dessus pour accéder au tchat";
                    statusMsg.className = "chat-status-msg";
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('dynamic-chat-container');
            const currentHour = new Date().getHours();
            
            // Horaires : Fermé entre 21h et 7h
            const isNight = currentHour >= 21 || currentHour < 7;

            if (isNight) {
                container.innerHTML = `
                    <div class="chat-card">
                        <div class="status-badge closed">
                            <span class="status-dot"></span> Service fermé
                        </div>
                        <h2>Le tchat est actuellement indisponible</h2>
                        <p class="description">Nos bénévoles sont à votre écoute tous les jours de <strong>7h00 à 21h00</strong>.</p>

                        <ul class="emergency-list">
                            <li class="emergency-item">3114 — Prévention du suicide (24h/24)</li>
                            <li class="emergency-item">112, 15 ou 17 — Urgences vitales</li>
                        </ul>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="chat-card">
                        <div class="status-badge open">
                            <span class="status-dot"></span> Écoute ouverte (7h – 21h)
                        </div>
                        <h2>Échanger avec un bénévole</h2>
                        <p class="description">Un espace d'écoute confidentiel et sécurisé pour vous accompagner au quotidien.</p>

                        <div class="cgu-box">
                            <input type="checkbox" id="cguConsent" onchange="handleCguConsent(this)">
                            <label for="cguConsent">J'accepte les <a href="cgu.html" target="_blank">conditions générales d'utilisation</a></label>
                        </div>

                        <p id="chatStatusMsg" class="chat-status-msg">
                            Cochez la case ci-dessus pour accéder au tchat
                        </p>
                    </div>
                `;
            }
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
